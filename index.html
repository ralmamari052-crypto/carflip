<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كار فليب</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23272B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كار فليب">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{
  --bg:#E4E8EB; --surface:#FFFFFF; --surface-2:#F2F4F6; --ink:#15233B; --muted:#5A6778; --line:#CBD2D9;
  --tag:#F5B800; --tag-ink:#1D1600; --gain:#0B8F63; --gain-bg:#DDF4EA; --loss:#D6334A; --loss-bg:#FCE6EA;
  --asphalt:#23272B;
  --steel:#2F5A8A; --focus:#2F5A8A;
  --c1:#2F5A8A; --c2:#7457A3; --c3:#2A8796; --c4:#C2850E; --c5:#5D6B7A; --c6:#93AEC7;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151D; --surface:#17202B; --surface-2:#1E2936; --ink:#E6EBF1; --muted:#93A2B4; --line:#2C3A4A;
    --tag:#F5B800; --tag-ink:#1D1600; --gain:#34D399; --gain-bg:#12302A; --loss:#FB7185; --loss-bg:#3B1A24;
    --steel:#86AEDD; --focus:#86AEDD;
    --c1:#5B8BC4; --c2:#9C82C9; --c3:#4FB3C2; --c4:#E0A32E; --c5:#8796A6; --c6:#C1D3E3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#17202B; --surface-2:#1E2936; --ink:#E6EBF1; --muted:#93A2B4; --line:#2C3A4A;
  --gain:#34D399; --gain-bg:#12302A; --loss:#FB7185; --loss-bg:#3B1A24; --steel:#86AEDD; --focus:#86AEDD;
  --c1:#5B8BC4; --c2:#9C82C9; --c3:#4FB3C2; --c4:#E0A32E; --c5:#8796A6; --c6:#C1D3E3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:auto}
body{background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--asphalt)}
.display{font-family:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif}
.num{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
#printArea{display:none}
@media print{
  @page{size:A4; margin:14mm}
  body{background:#fff!important; color:#111!important; padding:0!important}
  body::before, body > *:not(#printArea){display:none!important}
  #printArea{-webkit-print-color-adjust:exact; print-color-adjust:exact; display:block!important; font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif; font-size:11pt; color:#111; direction:rtl}
  #printArea h1{font-family:Alexandria,sans-serif; font-size:18pt; font-weight:800; margin:0}
  #printArea h2{font-family:Alexandria,sans-serif; font-size:12pt; font-weight:700; margin:16px 0 6px; padding-bottom:3px; border-bottom:2px solid #F5B800}
  #printArea h3{font-weight:700; margin:8px 0 2px}
  #printArea p{margin:2px 0}
  .pr-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:4px solid #23272B; padding-bottom:8px; margin-bottom:8px}
  .pr-brand{background:#23272B; color:#F5B800; font-family:Alexandria,sans-serif; font-weight:800; padding:6px 12px; border-radius:6px; text-align:center}
  .pr-brand small{color:#fff; font-weight:400}
  #printArea table{width:100%; border-collapse:collapse; page-break-inside:auto}
  #printArea td{padding:5px 8px; border-bottom:1px solid #ddd}
  #printArea td.v{text-align:left; direction:ltr; font-variant-numeric:tabular-nums}
  #printArea tr.b td{font-weight:700; background:#FFF6D6}
  #printArea tr.h td{font-weight:700; background:#eee}
  .pr-note{background:#f5f5f5; padding:6px 8px; border-radius:4px; margin-top:8px}
  .pr-imgs{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .pr-imgs img{width:100%; height:120px; object-fit:cover; border-radius:4px}
  .pr-ai ul{padding-right:18px; list-style:disc}
}

/* header */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--asphalt); color:#fff}
.topbar::after{content:""; position:absolute; inset:auto 0 0 0; height:3px; background:repeating-linear-gradient(90deg,var(--tag) 0 28px,transparent 28px 46px)}
.logo-mark{display:block; width:42px; height:42px; flex:none}

/* panels */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px}
.sec-title{font-family:Alexandria,sans-serif; font-weight:700; font-size:1.02rem}
.hint{color:var(--muted); font-size:.82rem}
label.fld{display:flex; flex-direction:column; gap:4px; font-size:.84rem; color:var(--muted); font-weight:500}
.inp{width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:7px; padding:9px 11px; font-size:.95rem; font-family:inherit; min-height:42px}
.inp:focus{outline:none; border-color:var(--focus); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent)}
.inp[type=number]{font-variant-numeric:tabular-nums}
.unit-wrap{position:relative}
.unit-wrap .inp{padding-left:46px}
.unit{position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:.78rem; color:var(--muted); pointer-events:none}
textarea.inp{min-height:76px; resize:vertical}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:8px; padding:9px 16px; font-weight:600; font-size:.92rem; min-height:42px; cursor:pointer; border:1px solid transparent; font-family:inherit}
.btn-primary{background:var(--tag); color:var(--tag-ink)}
.btn-primary:hover{filter:brightness(.95)}
.btn-ink{background:var(--ink); color:var(--surface)}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:transparent; color:var(--loss); border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
.btn-danger.armed{background:var(--loss); color:#fff}
.btn:disabled{opacity:.55; cursor:not-allowed}
.icon-btn{width:38px; height:38px; display:inline-grid; place-items:center; border-radius:7px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer}
.icon-btn:hover{color:var(--loss); border-color:var(--loss)}

/* lot tag card */
.lot{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; text-align:right; cursor:pointer; color:inherit}
.lot:hover{border-color:var(--steel)}
.lot-strip{background:var(--tag); color:var(--tag-ink); display:flex; justify-content:space-between; align-items:center; padding:6px 14px; font-family:Alexandria,sans-serif; font-weight:700; font-size:.8rem}
.lot-strip .hole{width:10px; height:10px; border-radius:50%; background:var(--bg); border:2px solid color-mix(in srgb,var(--tag-ink) 35%, transparent)}
.lot-photo{aspect-ratio:16/9; background:var(--surface-2); display:grid; place-items:center; color:var(--muted); overflow:hidden}
.lot-photo img{width:100%; height:100%; object-fit:cover}
.thumb.broken img{opacity:0}
.thumb.broken::after{content:"تعذّر تحميل الصورة"; position:absolute; inset:0; display:grid; place-items:center; font-size:.75rem; color:var(--muted); text-align:center; padding:6px}

.pill{display:inline-flex; align-items:center; gap:6px; font-size:.76rem; font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid var(--line); white-space:nowrap}
.pill .dot{width:7px; height:7px; border-radius:50%}
.st-draft .dot{background:var(--c5)} .st-shipping .dot{background:var(--c1)} .st-repair .dot{background:var(--c4)} .st-ready .dot{background:var(--c3)} .st-sold .dot{background:var(--gain)}

.chip{padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:.85rem; font-weight:500; cursor:pointer; color:var(--ink); white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}

/* status stepper */
.steps{display:flex; gap:0; overflow-x:auto}
.step{flex:1 0 auto; padding:9px 12px; border:1px solid var(--line); background:var(--surface-2); font-size:.83rem; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; margin-inline-start:-1px}
.step:first-child{border-radius:0 8px 8px 0; margin-inline-start:0}
.step:last-child{border-radius:8px 0 0 8px}
.step.done{color:var(--ink); background:var(--surface)}
.step.cur{background:var(--ink); color:var(--surface); border-color:var(--ink)}

/* breakdown */
.bar{display:flex; height:16px; border-radius:4px; overflow:hidden; background:var(--surface-2)}
.bar span{display:block; height:100%; transition:width .35s ease}
.legend-row{display:grid; grid-template-columns:12px 1fr auto auto; gap:8px; align-items:center; font-size:.86rem; padding:5px 0; border-bottom:1px dashed var(--line)}
.legend-row:last-child{border-bottom:0}
.sw{width:10px; height:10px; border-radius:2px}

table.tbl{width:100%; border-collapse:collapse; font-size:.9rem}
.tbl th{font-weight:600; color:var(--muted); font-size:.78rem; text-align:right; padding:6px 8px; border-bottom:1px solid var(--line)}
.tbl td{padding:8px; border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.hl td{background:color-mix(in srgb,var(--tag) 14%, transparent)}

.gain{color:var(--gain)} .loss{color:var(--loss)}
.verdict{border-radius:8px; padding:12px 14px; font-weight:600}
.verdict.good{background:var(--gain-bg); color:var(--gain)}
.verdict.bad{background:var(--loss-bg); color:var(--loss)}
.verdict.mid{background:color-mix(in srgb,var(--tag) 18%, transparent); color:var(--ink)}

.line-row{display:grid; gap:8px; align-items:end}
.parts-row{grid-template-columns:1fr 70px 120px 38px}
.labor-row{grid-template-columns:1fr 130px 38px}
@media (max-width:520px){ .parts-row{grid-template-columns:1fr 60px 100px 38px} .labor-row{grid-template-columns:1fr 110px 38px} }

.ai-out h3{font-family:Alexandria,sans-serif; font-weight:700; font-size:1rem; margin:16px 0 6px}
.ai-out h3:first-child{margin-top:0}
.ai-out p{margin:4px 0}
.ai-out ul{margin:4px 0; padding-inline-start:20px; list-style:disc}
.ai-out li{margin:3px 0}

.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px}
.thumb{position:relative; aspect-ratio:4/3; border-radius:8px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line)}
.thumb img{width:100%; height:100%; object-fit:cover; cursor:zoom-in}
.thumb button{position:absolute; top:4px; left:4px; width:28px; height:28px; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; border:0; cursor:pointer}

.mobile-bar{position:fixed; bottom:0; inset-inline:0; z-index:15; background:var(--asphalt); border-top:3px solid var(--tag); color:#fff; padding:10px 16px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:space-between; align-items:center; gap:12px}
@media (min-width:1024px){ .mobile-bar{display:none} }
.lightbox{position:fixed; inset:0; z-index:40; background:rgba(5,8,12,.88); display:grid; place-items:center; padding:20px}
.lightbox img{max-width:100%; max-height:100%; border-radius:8px}
.toast{position:fixed; bottom:calc(84px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); z-index:50; background:var(--ink); color:var(--surface); padding:10px 18px; border-radius:8px; font-size:.9rem; box-shadow:0 6px 20px rgba(0,0,0,.25)}
.skeleton{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2)); background-size:200% 100%; animation:sh 1.2s infinite; border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
</style>
<style>
.auth-wrap{min-height:calc(100vh - 160px); display:grid; place-items:center}
.tabs{display:grid; grid-template-columns:1fr 1fr; background:var(--surface-2); border-radius:9px; padding:4px; gap:4px}
.tabs button{padding:8px; border-radius:7px; font-weight:600; color:var(--muted); cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.gbtn{background:var(--surface); border:1px solid var(--line); color:var(--ink); width:100%}
.gbtn:hover{background:var(--surface-2)}
.or{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.82rem}
.or::before,.or::after{content:""; flex:1; height:1px; background:var(--line)}
.err{background:var(--loss-bg); color:var(--loss); border-radius:8px; padding:9px 12px; font-size:.88rem}
.ok{background:var(--gain-bg); color:var(--gain); border-radius:8px; padding:9px 12px; font-size:.88rem}
.setup ol{counter-reset:s; display:grid; gap:14px}
.setup li{counter-increment:s; display:grid; grid-template-columns:34px 1fr; gap:12px}
.setup li::before{content:counter(s); width:30px; height:30px; border-radius:50%; background:var(--tag); color:var(--tag-ink); display:grid; place-items:center; font-weight:700; font-family:Alexandria,sans-serif}
.setup code{background:var(--surface-2); border:1px solid var(--line); padding:1px 6px; border-radius:5px; font-size:.85em; direction:ltr; unicode-bidi:isolate}
#navMore{display:flex; align-items:center; gap:.5rem}
@media (max-width:639px){
  #navMore{display:none; position:absolute; top:calc(64px + env(safe-area-inset-top,0px)); left:12px; flex-direction:column; align-items:stretch; background:var(--asphalt); padding:8px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:30; min-width:170px}
  #navMore.open{display:flex}
  #navMore .btn{justify-content:flex-start}
}
#errBar{position:fixed; top:calc(70px + env(safe-area-inset-top,0px)); left:12px; right:12px; z-index:70; background:#7f1d1d; color:#fff; padding:10px 14px; border-radius:8px; font-size:.85rem; direction:ltr; text-align:left; word-break:break-word}
.userchip{font-size:.8rem; opacity:.8; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:ltr}
</style>
</head>
<body>
<header class="topbar">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">

      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="9" fill="#F5B800"/><path d="M5 28.5v-4.2c0-1.4 1-2.5 2.4-2.8l4.6-1 3.6-3.9c.6-.7 1.5-1 2.4-1h5.6c.9 0 1.8.4 2.4 1.1l3.3 3.8h1.6c1.8 0 3.1 1.4 3.1 3.1v4.9z" fill="#1D1600"/><path d="M16.2 20.3l2.6-2.9h4.3l2.4 2.9z" fill="#F5B800"/><circle cx="11.6" cy="29" r="3.5" fill="#1D1600" stroke="#F5B800" stroke-width="1.4"/><circle cx="28.4" cy="29" r="3.5" fill="#1D1600" stroke="#F5B800" stroke-width="1.4"/><path d="M22.5 13.2 33 6.2M27.2 5.6H33.4V11.8" fill="none" stroke="#1D1600" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="leading-tight">
        <span class="display font-bold text-lg block">كار فليب</span>
      </span>
    </a>
    <div class="flex items-center gap-2">
    <button id="installBtn" class="btn btn-primary hidden !min-h-[38px] !px-3" aria-label="تثبيت التطبيق">⬇<span class="hidden sm:inline"> تثبيت التطبيق</span></button>
    <div id="userBox" class="hidden items-center gap-2">
      <span id="saveState" class="text-xs opacity-70 hidden md:inline" aria-live="polite"></span>
      <span id="userEmail" class="userchip hidden sm:inline"></span>

      <button id="menuBtn" class="btn btn-ghost sm:hidden !text-white !border-white/25 !min-h-[38px] !px-3" aria-label="القائمة" aria-expanded="false" aria-controls="navMore">☰</button>
      <div id="navMore">
      <button id="teamBtn" class="btn btn-ghost hidden !text-white !border-white/25 hover:!bg-white/10 !min-h-[38px] !px-3">الفريق</button>
      <button id="settingsBtn" class="btn btn-ghost !text-white !border-white/25 hover:!bg-white/10 !min-h-[38px] !px-3">الإعدادات</button>
      <button id="logoutBtn" class="btn btn-ghost !text-white !border-white/25 hover:!bg-white/10 !min-h-[38px] !px-3">خروج</button>
      </div>
    </div>
    </div>
  </div>
</header>

<main id="app" class="max-w-6xl mx-auto px-4 py-6 pb-28 lg:pb-10"></main>

<div id="iosDlg" class="hidden fixed inset-0 z-30 bg-black/50 grid place-items-center p-4" role="dialog" aria-modal="true" aria-labelledby="iosTitle">
  <div class="panel w-full max-w-sm p-5">
    <h2 id="iosTitle" class="sec-title mb-3">تثبيت كار فليب على الآيفون</h2>
    <ol class="grid gap-2 text-sm list-decimal pr-5">
      <li>افتحي الموقع في متصفح <b>Safari</b>.</li>
      <li>اضغطي زر المشاركة <span aria-hidden="true">⬆️</span> أسفل الشاشة.</li>
      <li>اختاري <b>«إضافة إلى الشاشة الرئيسية»</b> ثم «إضافة».</li>
    </ol>
    <div class="flex justify-end mt-5"><button id="iosClose" class="btn btn-ink">حسناً</button></div>
  </div>
</div>

<div id="settingsDlg" class="hidden fixed inset-0 z-30 bg-black/50 grid place-items-center p-4" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="panel w-full max-w-md p-5">
    <h2 id="setTitle" class="sec-title mb-1">الإعدادات</h2>
    <p class="hint mb-4">تُطبَّق الافتراضات على السيارات الجديدة فقط.</p>
    <div class="grid gap-3">
      <label class="fld">العملة المحلية وسوق البيع
        <select id="setCurrency" class="inp"></select>
      </label>
      <div class="grid grid-cols-2 gap-3">
        <label class="fld">الجمارك الافتراضية %<input id="setCustoms" type="number" step="0.1" class="inp"></label>
        <label class="fld">ضريبة القيمة المضافة %<input id="setVat" type="number" step="0.1" class="inp"></label>
      </div>
      <label class="fld">سعر صرف الدولار الافتراضي<input id="setRate" type="number" step="0.0001" class="inp"></label>
      <label class="fld">المظهر
        <select id="setTheme" class="inp"><option value="">حسب الجهاز</option><option value="light">فاتح</option><option value="dark">داكن</option></select>
      </label>
    </div>
    <div class="flex gap-2 justify-end mt-5">
      <button id="setCancel" class="btn btn-ghost">إلغاء</button>
      <button id="setSave" class="btn btn-ink">حفظ الإعدادات</button>
    </div>
  </div>
</div>

/* ---------- الحسابات ---------- */
function calc(c){
  const b=c.buy||{}, l=c.local||{}; const rate=n(c.rate)||1;
  const usdOther=n(b.auctionFee)+n(b.usInland)+n(b.sea)+n(b.insurance);
  const usdTotal=n(b.price)+usdOther;
  const cif=usdTotal*rate;
  const customs=cif*n(l.customsPct)/100;
  const vat=(cif+customs)*n(l.vatPct)/100;
  const fees=n(l.clearance)+n(l.portTransport)+n(l.registration);
  const parts=(c.parts||[]).reduce((s,p)=>s+n(p.qty||1)*n(p.price),0);
  const labor=(c.labor||[]).reduce((s,p)=>s+n(p.cost),0);
  const cleaning=n(c.cleaning);
  const seg={cif,duties:customs+vat,fees,parts,labor,cleaning};
  const total=cif+customs+vat+fees+parts+labor+cleaning;
  const market=n(c.marketPrice), sale=n(c.salePrice);
  const r={usdTotal,usdOther,cif,customs,vat,fees,parts,labor,cleaning,seg,total,market,sale};
  if(market>0){ r.mProfit=market-total; r.mMargin=r.mProfit/market; r.mRoi=total?r.mProfit/total:NaN; }
  if(c.status==='sold' && sale>0){ r.aProfit=sale-total; r.aRoi=total?r.aProfit/total:NaN; }
  const k=rate*(1+n(l.customsPct)/100)*(1+n(l.vatPct)/100);
  const fixedLocal=fees+parts+labor+cleaning;
  if(market>0 && k>0){ const T=market/(1+n(c.targetPct)/100); r.maxBid=(T-fixedLocal)/k-usdOther; }
  return r;
}

  if(q){ try{ localStorage.setItem('carflip-key',q); }catch(e){} history.replaceState(null,'',location.pathname+location.hash); return {k:q,fresh:true}; }
  let k=null; try{ k=localStorage.getItem('carflip-key'); }catch(e){}

}

function parseKey(k){ const m=/^([a-z0-9]+)-([a-f0-9]{32})$/i.exec(k||''); return m?{id:m[1],secret:m[2]}:null; }

    let curChanged=false;

      const id=ch.doc.id;

      cars.set(id,data); if(view.id===id) curChanged=true;

/* نقل سيارات النسخة السابقة (الحساب الشخصي) إلى مرآب الشركة */
async function checkLegacy(){
  try{
    const flag=await FB.F.getDoc(dref('users',user.uid,'meta','migrated')); if(flag.exists()) return;
    const old=await FB.F.getDocs(FB.F.collection(FB.db,'users',user.uid,'cars')); if(old.empty) return;
    const bar=document.createElement('div'); bar.className='panel p-4 mb-5 flex flex-wrap items-center justify-between gap-3';
    bar.innerHTML=`<span>لديك <b class="num">${old.size}</b> سيارة من النسخة السابقة. انقليها إلى مرآب الشركة لتظهر هنا.</span><button class="btn btn-primary" id="migBtn">نقل السيارات</button>`;
    app.prepend(bar);
    $('#migBtn').onclick=async()=>{
      $('#migBtn').disabled=true; $('#migBtn').textContent='جارٍ النقل…';
      try{
        for(const d of old.docs){
          const c={...d.data(),ownerId:'admin',ownerName:'المدير'};
          await FB.F.setDoc(dref('cars',d.id),c);
          const ps=await FB.F.getDocs(FB.F.collection(FB.db,'users',user.uid,'cars',d.id,'photos'));
          for(const p of ps.docs) await FB.F.setDoc(dref('cars',d.id,'photos',p.id),p.data());
        }
        await FB.F.setDoc(dref('users',user.uid,'meta','migrated'),{at:Date.now()});
        bar.remove(); toast('نُقلت السيارات إلى مرآب الشركة');
      }catch(e){ toast('تعذّر النقل: '+(e.code||'')); $('#migBtn').disabled=false; $('#migBtn').textContent='إعادة المحاولة'; }
    };
  }catch(e){}
}

function setSaveState(s){const el=$('#saveState'); if(el) el.textContent={saving:'جارٍ الحفظ…',saved:'محفوظ',error:'تعذّر الحفظ، ستُعاد المحاولة'}[s]||''; }
function queueSave(car){ car.updatedAt=Date.now(); clearTimeout(pending[car.id]); setSaveState('saving'); pending[car.id]=setTimeout(()=>{delete pending[car.id]; flush(car.id)},700); }
async function flush(id){
  if(inflight[id]){inflight[id].again=true;return}
  const car=cars.get(id); if(!car||!user) return;
  inflight[id]={again:false};
  try{ await FB.F.setDoc(dref('cars',id),clone(car)); setSaveState('saved'); }
  catch(e){ setSaveState('error'); if(e.code!=='permission-denied'){ inflight[id].again=true; await new Promise(r=>setTimeout(r,2500)); } else toast('لا تملك صلاحية حفظ هذا التعديل'); }
  const again=inflight[id]?.again; delete inflight[id]; if(again && cars.has(id)) flush(id);
}
async function flushNow(id){ if(pending[id]){ clearTimeout(pending[id]); delete pending[id]; } await flush(id); }
async function saveSettings(){ try{ localStorage.setItem('carflip-theme',settings.theme||''); }catch(e){} if(!isAdmin()) return; const {theme,...rest}=settings; try{ await FB.F.setDoc(dref('settings','company'),rest); }catch(e){ toast('تعذّر حفظ الإعدادات'); } }

}

function route(){
  if(!user) return;
  if(unsubPhotos){ unsubPhotos(); unsubPhotos=null; photos=[]; }
  if(msgUnsub){ msgUnsub(); msgUnsub=null; }
  const h=(location.hash||'').slice(1);
  if(role!=='admin'&&role!=='emp') return;
  if(h==='team' && isAdmin()){ renderTeam(); }
  else if(h==='chat'||h.startsWith('chat-')){ renderChat(h.startsWith('chat-')?h.slice(5):null); }
  else if(h.startsWith('car-') && cars.has(h.slice(4))){ view={name:'car',id:h.slice(4)}; renderEditor(); }
  else { view={name:'garage',id:null}; renderGarage(); }

}

        <div><div class="hint">صافي الربح المحقق</div><div class="display font-bold text-xl ${r.aProfit<0?'loss':'gain'}">${money(r.aProfit)}</div></div>
        <div><div class="hint">العائد على التكلفة</div><div class="display font-bold text-xl">${pct(r.aRoi)}</div></div>
      </div>`:
    r.mProfit!=null?`
      ${verdict}
      <div class="grid grid-cols-3 gap-3 mt-4">
        <div><div class="hint">صافي الربح</div><div class="display font-bold text-lg ${r.mProfit<0?'loss':'gain'}">${money(r.mProfit)}</div></div>
        <div><div class="hint">العائد على التكلفة</div><div class="display font-bold text-lg">${pct(r.mRoi)}</div></div>
        <div><div class="hint">هامش من سعر البيع</div><div class="display font-bold text-lg">${pct(r.mMargin)}</div></div>
      </div>`:
    `<p class="hint">أدخل «سعر السوق المتوقع بعد الإصلاح» في قسم البيع لترى الربح والحكم على الصفقة.</p>`}
  </section>

  <section class="panel p-5">
    <h2 class="sec-title mb-1">أسعار البيع المقترحة</h2>
    <p class="hint mb-3">سعر البيع = التكلفة الإجمالية + نسبة الربح منها.</p>
    <div class="overflow-x-auto"><table class="tbl">
      <thead><tr><th>نسبة الربح</th><th>سعر البيع</th><th>صافي الربح</th></tr></thead>
      <tbody id="mTable">${marginRows(c,r)}</tbody>
    </table></div>
    <label class="fld mt-3">نسبة مخصصة<span class="unit-wrap"><input class="inp" type="number" min="0" step="1" inputmode="decimal" data-r="customPct" value="${c.customPct}"><span class="unit">%</span></span></label>
  </section>

  <section class="panel p-5" style="border-color:var(--tag); border-width:2px">
    <h2 class="sec-title mb-1">أقصى سعر مزايدة</h2>
    <p class="hint mb-3">أعلى سعر شراء في المزاد يحقق لك نسبة الربح المستهدفة، مع بقاء باقي التكاليف كما أدخلتها.</p>
    <label class="fld mb-3">نسبة الربح المستهدفة<span class="unit-wrap"><input class="inp" type="number" min="0" step="1" inputmode="decimal" data-r="targetPct" value="${c.targetPct}"><span class="unit">%</span></span></label>
    <div id="maxBid">${maxBidHtml(c,r)}</div>
  </section>`;
  updateMobileBar(c,r);
}
function marginRows(c,r){
  const ps=[...MARGINS]; const cp=n(c.customPct); if(cp>0 && !ps.includes(cp)) ps.push(cp);
  return ps.map(p=>`<tr class="${p===cp?'hl':''}"><td class="num">${p}%</td><td>${money(r.total*(1+p/100))}</td><td class="gain">${money(r.total*p/100)}</td></tr>`).join('');
}
function maxBidHtml(c,r){
  if(r.maxBid==null) return `<p class="hint">يحتاج «سعر السوق المتوقع» لحسابه.</p>`;
  if(r.maxBid<=0) return `<div class="verdict bad">حتى بسعر شراء صفر لن تحقق ${n(c.targetPct)}% — التكاليف الأخرى مرتفعة على سعر السوق.</div>`;
  const diff=r.maxBid-n(c.buy.price);
  return `<div class="display font-extrabold text-3xl">${usd(r.maxBid)}</div>
    <p class="mt-2 text-sm ${diff<0?'loss':'gain'}">${n(c.buy.price)>0?(diff>=0?`أعلى من سعر شرائك بـ ${usd(diff)} — لديك مساحة.`:`سعر شرائك يتجاوزه بـ ${usd(-diff)}.`):'أدخل سعر الشراء للمقارنة.'}</p>`;
}
function updateResultNumbers(c,r){ $('#rTotal').innerHTML=money(r.total); $('#mTable').innerHTML=marginRows(c,r); $('#maxBid').innerHTML=maxBidHtml(c,r); updateMobileBar(c,r); }
function updateMobileBar(c,r){
  const mb=$('#mbar'); if(!mb) return;
  const p=c.status==='sold'&&r.aProfit!=null?r.aProfit:r.mProfit;
  mb.innerHTML=`<div><div class="text-[11px] opacity-70">التكلفة الإجمالية</div><div class="display font-bold">${money(r.total)}</div></div>
   <div class="text-left"><div class="text-[11px] opacity-70">${c.status==='sold'&&r.aProfit!=null?'الربح المحقق':'الربح المتوقع'}</div><div class="display font-bold" style="color:${p==null?'inherit':p<0?'#FB7185':'#34D399'}">${p==null?'—':money(p)}</div></div>
   <button class="btn btn-primary !min-h-[38px] !px-3" id="toRes">النتائج</button>`;
  $('#toRes').onclick=()=>$('#results').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- الصور (مضغوطة داخل Firestore — تعمل على الخطة المجانية) ---------- */
function renderPhotos(){
  const c=cars.get(view.id); const box=$('#thumbs'); if(!box||!c) return;
  box.innerHTML=photos.map(p=>`<div class="thumb"><img src="${esc(p.data||p.url)}" alt="صورة السيارة" data-zoom="${p.id}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.thumb').classList.add('broken')"><button data-rmp="${p.id}" aria-label="إزالة الصورة">✕</button></div>`).join('');
  $('#photoHint').textContent=photos.length?`${photos.length} من 12 صورة`:'أرفق صور المزاد، الضرر، وصور ما بعد الإصلاح لتوثيق كل مرحلة.';
  if(!canEditCar(c)) box.querySelectorAll('[data-rmp]').forEach(b=>b.remove());
  box.querySelectorAll('[data-rmp]').forEach(b=>b.onclick=async()=>{
    try{ await FB.F.deleteDoc(FB.F.doc(photosCol(c.id),b.dataset.rmp));
      const rest=photos.filter(p=>p.id!==b.dataset.rmp); c.photoCount=rest.length;
      if(rest.length===0) c.thumb=''; else if(rest[0]) c.thumb=rest[0].url||await makeThumb(rest[0].data);
      queueSave(c);
    }catch(e){ toast('تعذّر حذف الصورة'); } });
  box.querySelectorAll('[data-zoom]').forEach(i=>i.onclick=()=>{ const p=photos.find(x=>x.id===i.dataset.zoom); if(!p) return; const lb=document.createElement('div'); lb.className='lightbox'; lb.innerHTML=`<img src="${esc(p.data||p.url)}" alt="" referrerpolicy="no-referrer">`; lb.onclick=()=>lb.remove(); document.body.appendChild(lb); });
}
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function shrinkToData(src,max,q){
  const img=await loadImg(src); const s=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); return cv.toDataURL('image/jpeg',q);
}
const makeThumb=src=>shrinkToData(src,320,.55);
async function addPhotoUrl(c,u){
  if(!/^https?:\/\/\S+$/i.test(u)){ toast('الصق رابطاً صحيحاً يبدأ بـ https://'); return false; }
  if(photos.length>=12){ toast('الحد 12 صورة لكل سيارة'); return false; }
  const ok=await new Promise(r=>{ const i=new Image(); i.referrerPolicy='no-referrer'; i.onload=()=>r(true); i.onerror=()=>r(false); i.src=u; setTimeout(()=>r(false),12000); });
  if(!ok){ toast('تعذّر عرض الصورة من هذا الرابط. تأكد أنه رابط صورة مباشر.'); return false; }
  try{
    await flushNow(c.id);
    await FB.F.setDoc(FB.F.doc(photosCol(c.id),lid()),{url:u,at:Date.now()});
    if(!c.thumb) c.thumb=u; c.photoCount=(c.photoCount||0)+1; queueSave(c); toast('أُضيفت الصورة'); return true;
  }catch(e){ toast('تعذّر إضافة الصورة'); return false; }
}
async function addPhotos(c,files){
  if(!files.length) return;
  if(photos.length>=12){ toast('الحد 12 صورة لكل سيارة'); return; }
  await flushNow(c.id);
  toast('جارٍ رفع الصور…');
  for(const f of files.slice(0,12-photos.length)){
    const u=URL.createObjectURL(f);
    try{
      let data=await shrinkToData(u,1200,.7);
      if(data.length>700000) data=await shrinkToData(u,900,.55);
      const id=lid();
      await FB.F.setDoc(FB.F.doc(photosCol(c.id),id),{data,at:Date.now()});
      if(!c.thumb) c.thumb=await makeThumb(data);
      c.photoCount=(c.photoCount||0)+1;
    }catch(e){ toast('تعذّر رفع إحدى الصور'); }
    finally{ URL.revokeObjectURL(u); }
  }
  queueSave(c);
}

/* ---------- التقرير الذكي (Gemini عبر Firebase AI Logic) ---------- */
function md(t){
  const lines=esc(t).split('\n'); let out='',inList=false;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  for(const raw of lines){ const l=raw.trim();
    if(/^[-•*]\s+/.test(l)){ if(!inList){out+='<ul>';inList=true} out+=`<li>${inl(l.replace(/^[-•*]\s+/,''))}</li>`; continue; }
    if(inList){out+='</ul>';inList=false}
    if(/^#{1,4}\s+/.test(l)) out+=`<h3>${inl(l.replace(/^#{1,4}\s+/,''))}</h3>`;
    else if(l) out+=`<p>${inl(l)}</p>`;
  }
  if(inList) out+='</ul>'; return out;
}
async function runAI(c){
  const out=$('#aiOut'); if(aiRunning) return;
  if(!FB.model){ out.innerHTML=`<p class="err">خدمة Gemini غير مفعّلة. فعّليها من Firebase ← AI Logic.</p>`; return; }
  const r=calc(c), K=cur();
  const partsTxt=(c.parts||[]).filter(p=>p.name||n(p.price)).map(p=>`${p.name||'قطعة'} × ${n(p.qty)||1} = ${fmt(n(p.qty||1)*n(p.price))}`).join('؛ ')||'لم تُدخل';
  const laborTxt=(c.labor||[]).filter(p=>n(p.cost)).map(p=>`${p.name||'بند'}: ${fmt(n(p.cost))}`).join('؛ ')||'لم تُدخل';
  const prompt=`أنت محلل مالي خبير في تجارة السيارات المستوردة من المزادات الأمريكية (Copart وIAAI) المصدومة، وإصلاحها وبيعها في ${K.m}. العملة المحلية: ${K.n} (${K.l}).
اكتب تقريراً عربياً موجزاً ومهنياً لتاجر عن جدوى هذه الصفقة.

بيانات السيارة:
- السيارة: ${carTitle(c)} | المزاد: ${c.auction} | نوع الملكية: ${c.titleType} | المسافة: ${c.mileage||'غير محددة'}
- وصف الضرر: ${c.damage||'غير موصوف'}
- الحالة الحالية: ${ST[c.status]}

الأرقام:
- سعر الشراء: $${fmt(n(c.buy.price),0)}، مصاريف المزاد والشحن والتأمين: $${fmt(r.usdOther,0)}، الإجمالي بالدولار $${fmt(r.usdTotal,0)} بسعر صرف ${c.rate}
- الجمارك (${c.local.customsPct}%): ${fmt(r.customs)}، الضريبة (${c.local.vatPct}%): ${fmt(r.vat)}، تخليص ونقل وتسجيل: ${fmt(r.fees)}
- قطع الغيار (${fmt(r.parts)}): ${partsTxt}
- الورشة (${fmt(r.labor)}): ${laborTxt}؛ التنظيف: ${fmt(r.cleaning)}
- التكلفة الإجمالية: ${fmt(r.total)} ${K.l}
- سعر السوق الذي يتوقعه التاجر: ${r.market?fmt(r.market)+' '+K.l:'لم يحدده'}${r.mProfit!=null?` (ربح متوقع ${fmt(r.mProfit)}، عائد ${(r.mRoi*100).toFixed(1)}%)`:''}
${c.status==='sold'&&r.aProfit!=null?`- بيعت فعلاً بـ ${fmt(r.sale)} بربح ${fmt(r.aProfit)}`:''}

التنسيق: عناوين تبدأ بـ "## " ونقاط تبدأ بـ "- " فقط، بلا جداول ولا رموز تعبيرية. الأقسام بالترتيب:
## الحكم على الصفقة
(سطر يبدأ بإحدى: مجدية / مجدية بشروط / غير مجدية، ثم السبب في جملتين)
## تقدير سعر السوق بعد الإصلاح
(نطاق تقريبي بالعملة المحلية لسيارة مماثلة مُصلحة في ${K.m}، مع أثر نوع الملكية والحادث على السعر. صرّح أنه تقدير يجب التحقق منه من الإعلانات المحلية)
## قراءة الأرقام
## مخاطر الضرر والتكاليف الخفية
## كيف ترفع الربح
## التوصية النهائية
(تتضمن سعر بيع مقترحاً وأقصى سعر شراء معقول في مزادات مشابهة)
لا تتجاوز 380 كلمة.`;
  aiRunning=true; const btn=$('#aiBtn'); btn.disabled=true; btn.textContent='جارٍ التحليل…';
  out.innerHTML=`<div class="grid gap-2"><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-4"></div><div class="skeleton h-4 w-5/6"></div></div>`;
  let text='';
  try{
    const result=await FB.model.generateContentStream(prompt);
    for await(const chunk of result.stream){ text+=chunk.text(); if(view.id===c.id && $('#aiOut')) $('#aiOut').innerHTML=md(text); }
    c.ai={text,at:Date.now()}; if(canEditCar(c)) queueSave(c);
    if(view.id===c.id && $('#aiOut')) $('#aiOut').innerHTML=md(text)+`<p class="hint mt-3">آخر تحليل: ${new Date(c.ai.at).toLocaleString('ar-OM')}</p>`;
  }catch(e){
    const s=String(e?.message||e);
    const msg=/not found|404/i.test(s)?`النموذج ${GEMINI_MODEL} غير متاح. غيّري قيمة GEMINI_MODEL في أعلى الكود إلى نموذج Gemini حالي.`:
      /quota|429|RESOURCE_EXHAUSTED/i.test(s)?'تجاوزتِ الحد المجاني لطلبات Gemini مؤقتاً؛ أعيدي المحاولة بعد دقيقة.':
      /app-check|appcheck|App Check/i.test(s)?'تعذّر التحقق من الموقع عبر App Check. تأكدي من تسجيل التطبيق في Firebase ← App Check بمفتاح reCAPTCHA السري.':/api-not-enabled|PERMISSION|403/i.test(s)?'خدمة Gemini غير مفعّلة لهذا المشروع. فعّليها من Firebase ← AI Logic.':'تعذّر إكمال التحليل. أعيدي المحاولة.';
    if($('#aiOut')) $('#aiOut').innerHTML=(text?md(text):'')+`<p class="err mt-2">${esc(msg)}</p>`;
  }finally{ aiRunning=false; const b=$('#aiBtn'); if(b){b.disabled=false; b.textContent='إعادة التحليل';} }
}

/* ---------- الإعدادات ---------- */
function openSettings(){
  $('#setCurrency').innerHTML=Object.entries(CUR).map(([k,v])=>`<option value="${k}" ${settings.currency===k?'selected':''}>${v.n} — ${v.m}</option>`).join('');
  $('#setCustoms').value=settings.customsPct; $('#setVat').value=settings.vatPct; $('#setRate').value=settings.rate; $('#setTheme').value=settings.theme||'';
  $('#settingsDlg').classList.remove('hidden'); $('#setCurrency').focus();
}
$('#setCurrency').onchange=e=>{ $('#setRate').value=CUR[e.target.value].rate; };
$('#settingsBtn').onclick=openSettings;
$('#setCancel').onclick=()=>$('#settingsDlg').classList.add('hidden');
$('#settingsDlg').onclick=e=>{ if(e.target.id==='settingsDlg') $('#settingsDlg').classList.add('hidden'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#settingsDlg').classList.add('hidden'); document.querySelector('.lightbox')?.remove(); }});
$('#setSave').onclick=()=>{
  settings={...settings,currency:$('#setCurrency').value,customsPct:n($('#setCustoms').value),vatPct:n($('#setVat').value),rate:n($('#setRate').value)||CUR[$('#setCurrency').value].rate,theme:$('#setTheme').value};
  applyTheme(); saveSettings(); $('#settingsDlg').classList.add('hidden'); toast('حُفظت الإعدادات'); route();
};
$('#logoutBtn').onclick=async()=>{ await Promise.all(Object.keys(pending).map(id=>flushNow(id))); location.hash=''; await FB.A.signOut(FB.auth); };
$('#teamBtn').onclick=()=>{ location.hash='team'; };
$('#menuBtn').onclick=e=>{ e.stopPropagation(); const o=$('#navMore').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded',o); };
document.addEventListener('click',e=>{ if(!e.target.closest('#navMore')||e.target.closest('button')){ if(e.target.id!=='menuBtn') { $('#navMore').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false'); } } });
window.addEventListener('hashchange',()=>$('#navMore').classList.remove('open'));
$('#chatBtn').onclick=()=>{ location.hash='chat'; };

let toastT;
function toast(msg){ document.querySelector('.toast')?.remove(); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2800); }

/* ---------- عرض الأخطاء على الشاشة (للتشخيص) ---------- */
function showErr(m){ let b=$('#errBar'); if(!b){ b=document.createElement('div'); b.id='errBar'; b.title='اضغط للإخفاء'; b.onclick=()=>b.remove(); document.body.appendChild(b); } b.textContent='⚠ '+String(m).slice(0,300); }
window.addEventListener('error',e=>{ if(e.message && !/ResizeObserver/.test(e.message)) showErr(e.message+(e.filename?' @'+e.filename.split('/').pop()+':'+e.lineno:'')); });
window.addEventListener('unhandledrejection',e=>{ const r=e.reason; showErr(r?.code||r?.message||String(r)); });

/* ---------- التثبيت كتطبيق ---------- */
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e))); }
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let deferredPrompt=null; const installBtn=$('#installBtn');
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; if(!isStandalone()) installBtn.classList.remove('hidden'); });
window.addEventListener('appinstalled',()=>{ installBtn.classList.add('hidden'); deferredPrompt=null; toast('ثُبّت كار فليب على جهازك'); });
if(isIOS && !isStandalone()) installBtn.classList.remove('hidden');
installBtn.onclick=async()=>{
  if(deferredPrompt){ deferredPrompt.prompt(); const {outcome}=await deferredPrompt.userChoice; if(outcome==='accepted') installBtn.classList.add('hidden'); deferredPrompt=null; }
  else if(isIOS) $('#iosDlg').classList.remove('hidden');
};
$('#iosClose').onclick=()=>$('#iosDlg').classList.add('hidden');

/* ---------- التشغيل ---------- */
app.addEventListener('input',onInput); app.addEventListener('change',onInput);
applyTheme();
if(!configured) renderSetup();
else {
  app.innerHTML=`<div class="grid sm:grid-cols-3 gap-4">${'<div class="skeleton h-40"></div>'.repeat(3)}</div>`;
  initFirebase().catch(e=>{ app.innerHTML=`<div class="panel p-6"><p class="err">تعذّر تشغيل Firebase: ${esc(e.message)}</p><p class="hint mt-3">تحققي من لصق firebaseConfig كاملاً وصحيحاً.</p></div>`; });
}
</script>
